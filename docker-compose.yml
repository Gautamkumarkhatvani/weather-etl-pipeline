version: "3.9"

services:

  postgres:
    image: postgres:16

    container_name: weather_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: weather_pipeline

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  weather-etl:
    build: .

    container_name: weather_etl

    depends_on:
      - postgres

    env_file:
      - .env

volumes:
  postgres_data: